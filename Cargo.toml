[package]
name = "netbridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Non-admin LAN and USB network selection for proxy-aware Windows applications"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
socket2 = { version = "0.6.3", features = ["all"] }
httparse = "1.10.1"
url = "2.5.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
roxmltree = "0.20"
sha1 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock", "Win32_Networking_WinInet", "Win32_System_Memory",
    "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_Security",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem"
] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
