name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/src-tauri/target
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Restore Rust dependency cache
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-x64-msvc
          workspaces: desktop/src-tauri -> target
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
        working-directory: desktop
      - name: Validate release metadata
        run: |
          node scripts/version.mjs --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test scripts/release.test.mjs scripts/release-context.test.mjs
          exit $LASTEXITCODE
      - run: npm run build
        working-directory: desktop
      - name: Rust tests and Clippy
        shell: pwsh
        run: |
          cargo test --locked --manifest-path Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --all-targets -- -D warnings
          exit $LASTEXITCODE
      - run: npx playwright install chromium
        working-directory: desktop
      - name: UI and production CSP
        working-directory: desktop
        shell: pwsh
        run: |
          npm run test:e2e -- --grep-invert "capture design states"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:production
          exit $LASTEXITCODE
      - name: Build Windows release EXE
        run: cargo build --release --locked --manifest-path desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NetBridge-windows-x64-${{ github.sha }}
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/netbridge-desktop.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: windows-test-results
          path: desktop/test-results
