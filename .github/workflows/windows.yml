name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/src-tauri/target
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - run: npm ci
        working-directory: desktop
      - name: Validate release metadata
        run: |
          node scripts/version.mjs --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test scripts/release.test.mjs
          exit $LASTEXITCODE
      - run: npm run build
        working-directory: desktop
      - name: Rust tests and Clippy
        shell: pwsh
        run: |
          cargo test --locked --manifest-path Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --all-targets -- -D warnings
          exit $LASTEXITCODE
      - run: npx playwright install chromium
        working-directory: desktop
      - name: UI and production CSP
        working-directory: desktop
        shell: pwsh
        run: |
          npm run test:e2e -- --grep-invert "capture design states"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:production
          exit $LASTEXITCODE
      - name: Build Windows release EXE
        run: cargo build --release --locked --manifest-path desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NetBridge-windows-x64-${{ github.sha }}
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/netbridge-desktop.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: windows-test-results
          path: desktop/test-results
